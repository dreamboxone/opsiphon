# Part of opsiphon - Psiphon for OpenWrt - https://github.com/dreamboxone/opsiphon
#
# Build the Psiphon core from source and publish installable OpenWrt packages.
#
# Triggered by pushing a version tag:
#
#     git tag v1.0.1 && git push origin v1.0.1
#
# For every architecture below it cross compiles psiphon-tunnel-core with Go,
# then packages opsiphon + luci-app-opsiphon with the apk tool from an official
# OpenWrt SDK, and attaches the results to a GitHub Release.

name: Build and release packages

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      openwrt_release:
        description: 'OpenWrt release to take the apk tool from'
        default: '25.12.5'

permissions:
  contents: write

env:
  OPENWRT_RELEASE: '25.12.5'
  SDK_TARGET: 'ipq40xx/generic'      # only the host apk tool is used from it

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armv7      # ipq40xx, mvebu, most ARM routers
            openwrt_arch: arm_cortex-a7_neon-vfpv4
          - name: aarch64    # filogic, rockchip, newer ARM64 routers
            openwrt_arch: aarch64_cortex-a53
          - name: mipsel     # ramips / mt7621
            openwrt_arch: mipsel_24kc
          - name: x86_64     # x86 builds and VMs
            openwrt_arch: x86_64

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          # the Go sources live in the psiphon-tunnel-core clone build-core.sh
          # makes, not in this repository, so there is no go.sum here to cache
          cache: false

      - name: Build the Psiphon core for ${{ matrix.name }}
        run: |
          set -euo pipefail
          sh ./build/build-core.sh ${{ matrix.name }}
          ls -l prebuilt/${{ matrix.openwrt_arch }}/psiphon-tunnel-core
          file prebuilt/${{ matrix.openwrt_arch }}/psiphon-tunnel-core

      - name: Fetch the apk tool from an OpenWrt SDK
        run: |
          set -euo pipefail
          rel="${{ github.event.inputs.openwrt_release || env.OPENWRT_RELEASE }}"
          base="https://downloads.openwrt.org/releases/${rel}/targets/${SDK_TARGET}"

          # the SDK filename carries the toolchain version, so discover it
          name=$(curl -fsSL "$base/" \
                 | grep -o 'openwrt-sdk-[^"]*\.Linux-x86_64\.tar\.\(xz\|zst\)' \
                 | head -1)
          [ -n "$name" ] || { echo "::error::no SDK found under $base"; exit 1; }
          echo "SDK: $name"

          curl -fsSL --retry 3 -o sdk.tar "$base/$name"
          mkdir -p sdk
          case "$name" in
            *.zst) sudo apt-get update -qq && sudo apt-get install -y zstd
                   tar --use-compress-program=unzstd -xf sdk.tar -C sdk --strip-components=1 ;;
            *.xz)  tar -xJf sdk.tar -C sdk --strip-components=1 ;;
          esac

          echo "APK_BIN=$PWD/sdk/staging_dir/host/bin/apk" >> "$GITHUB_ENV"
          "$PWD/sdk/staging_dir/host/bin/apk" --version

      - name: Package for ${{ matrix.openwrt_arch }}
        run: |
          set -euo pipefail
          # run as root so the packaged files are owned by root:root.
          # .apk is for OpenWrt 25.12 and later, .ipk for 23.05 and 24.10 -
          # both take their file lists from build/packages.inc.sh
          sudo -E sh ./build/build-apk.sh "${{ matrix.openwrt_arch }}" "$APK_BIN"
          sudo -E sh ./build/build-ipk.sh "${{ matrix.openwrt_arch }}"
          ls -l dist/

      - name: Verify the packages
        run: |
          set -euo pipefail
          for f in dist/*.apk; do
            echo "== $f"
            # informational only - never fail the release over a formatting
            # difference in a future apk version
            "$APK_BIN" adbdump "$f" | grep -E '^[[:space:]]*(name|version|arch):' || true
          done

          rm -rf verify && mkdir -p verify/apk verify/ipk

          # the core must be executable and the right architecture, in both
          # package formats - shipping it 0644 is exactly the mistake that
          # makes a package install cleanly and then do nothing
          "$APK_BIN" extract --destination verify/apk --allow-untrusted --no-chown dist/opsiphon-*.apk
          test -x verify/apk/usr/bin/psiphon-tunnel-core
          file verify/apk/usr/bin/psiphon-tunnel-core

          tar -xzf dist/opsiphon_*_${{ matrix.openwrt_arch }}.ipk -C verify/ipk
          test "$(cat verify/ipk/debian-binary)" = "2.0"
          mkdir verify/ipk/data verify/ipk/control
          tar -xzf verify/ipk/data.tar.gz    -C verify/ipk/data
          tar -xzf verify/ipk/control.tar.gz -C verify/ipk/control
          test -x verify/ipk/data/usr/bin/psiphon-tunnel-core
          file verify/ipk/data/usr/bin/psiphon-tunnel-core
          echo "== ipk control"
          cat verify/ipk/control/control
          grep -qx "Architecture: ${{ matrix.openwrt_arch }}" verify/ipk/control/control
          test -x verify/ipk/control/postinst
          test -x verify/ipk/control/prerm

          # the two formats must ship the same tree. The file lists live in
          # one place so they cannot drift; this is what proves it. Only the
          # apk carries lib/apk metadata - opkg writes its own at install time
          ( cd verify/apk      && find . -type f -o -type l ) | grep -v '^\./lib/apk/' | sort > apk.list
          ( cd verify/ipk/data && find . -type f -o -type l ) | sort > ipk.list
          diff apk.list ipk.list
          echo "== both formats ship $(wc -l < ipk.list) identical paths"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: opsiphon-${{ matrix.openwrt_arch }}
          path: |
            dist/*.apk
            dist/*.ipk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Collect every architecture
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Lay the files out for the release
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/opsiphon-*; do
            arch="${dir#artifacts/opsiphon-}"
            # .apk filenames carry no architecture, so add one. The LuCI
            # package is architecture independent and identical in every
            # job, so one copy of it is enough.
            for f in "$dir"/*.apk; do
              [ -e "$f" ] || continue
              base=$(basename "$f" .apk)
              case "$base" in
                luci-app-*) cp -f "$f" "release/$base.apk" ;;
                *)          cp -f "$f" "release/$base.$arch.apk" ;;
              esac
            done
            # .ipk filenames already carry it, in opkg's own
            # <name>_<version>_<arch> form, so keep them as they are
            for f in "$dir"/*.ipk; do
              [ -e "$f" ] || continue
              cp -f "$f" "release/$(basename "$f")"
            done
          done
          ls -l release/
          (cd release && sha256sum *.apk *.ipk > SHA256SUMS)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          cat > notes.md <<'NOTES'
          ### Which files do I need?

          Two, and both must match your OpenWrt release:

          | Your OpenWrt | Package manager | Take these |
          |---|---|---|
          | 25.12 and later | `apk` | `opsiphon-*.<arch>.apk` + `luci-app-opsiphon-*.apk` |
          | 24.10, 23.05 | `opkg` | `opsiphon_*_<arch>.ipk` + `luci-app-opsiphon_*_all.ipk` |

          Find your architecture with `opkg print-architecture` on 23.05 and
          24.10, or read `DISTRIB_ARCH` from `/etc/openwrt_release` on any
          release. The `luci-app-opsiphon` package is architecture
          independent - the same file works everywhere.

          ### Install - OpenWrt 25.12 and later

          ```sh
          scp opsiphon-*.apk luci-app-opsiphon-*.apk root@192.168.1.1:/tmp/
          ssh root@192.168.1.1 'apk add --allow-untrusted /tmp/opsiphon-*.apk /tmp/luci-app-opsiphon-*.apk'
          ```

          ### Install - OpenWrt 24.10 and 23.05

          ```sh
          scp opsiphon_*.ipk luci-app-opsiphon_*.ipk root@192.168.1.1:/tmp/
          ssh root@192.168.1.1 'opkg update && opkg install /tmp/opsiphon_*.ipk /tmp/luci-app-opsiphon_*.ipk'
          ```

          Then open LuCI, go to **Services -> Psiphon** and press **Connect**.
          Nothing runs until you do.

          `SHA256SUMS` covers every file above.

          Full guide: README.md (English), README.fa.md (فارسی).
          NOTES
          sed -i 's/^          //' notes.md

          # the tag may already have an (empty) release attached - one made
          # by hand before the build was green, for instance - and
          # `gh release create` refuses to overwrite it, so upload into it
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists - updating it"
            gh release upload "$tag" release/* --clobber
            gh release edit   "$tag" --title "Opsiphon $tag" --notes-file notes.md
          else
            gh release create "$tag" release/* \
              --title "Opsiphon $tag" \
              --notes-file notes.md
          fi
